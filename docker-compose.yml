services:
  postgres:
    image: postgres:18.4-alpine3.24
    container_name: repo-postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: repo-adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"

  minio:
    image: minio/minio:latest
    container_name: repo-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.minio-data:/data

  tasks:
    build:
      context: .
      dockerfile: apps/tasks/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:${DATABASE_PASSWORD:-postgres}@postgres:5432/postgres
      S3_ENDPOINT: http://minio:9000
    container_name: repo-tasks
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
